name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required OSS files
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f docs/protocol.md
          test -f docs/threat-model.md
          test -f docs/abuse-policy.md
          test -f docs/release-checklist.md
          test -f docs/real-device-testing.md
          test -f docs/server-integration.md
          test -f TODO.impl/README.md
          test -f app/src/main/AndroidManifest.xml
      - name: Check forbidden placeholders
        run: |
          ! grep -R "TODO[:][[:space:]]secret" -n .
      - name: Check restricted SMS scope
        run: |
          ! grep -R "android.permission.READ_SMS" -n app/src/main/AndroidManifest.xml
          grep -R "android.permission.SEND_SMS" -n app/src/main/AndroidManifest.xml

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qasidrelay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release signing
        id: release_signing
        env:
          QASIDRELAY_SIGNING_KEYSTORE_BASE64: ${{ secrets.QASIDRELAY_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$QASIDRELAY_SIGNING_KEYSTORE_BASE64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; skipping signed APK."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/qasidrelay-signing"
          printf '%s' "$QASIDRELAY_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qasidrelay-signing/release.p12"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$RUNNER_TEMP/qasidrelay-signing/release.p12" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.release_signing.outputs.available == 'true'
        env:
          QASIDRELAY_SIGNING_KEYSTORE_PATH: ${{ steps.release_signing.outputs.keystore_path }}
          QASIDRELAY_SIGNING_STORE_PASSWORD: ${{ secrets.QASIDRELAY_SIGNING_STORE_PASSWORD }}
          QASIDRELAY_SIGNING_KEY_ALIAS: ${{ secrets.QASIDRELAY_SIGNING_KEY_ALIAS }}
          QASIDRELAY_SIGNING_KEY_PASSWORD: ${{ secrets.QASIDRELAY_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Upload signed release APK artifact
        if: steps.release_signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qasidrelay-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  instrumentation:
    if: github.event_name == 'pull_request'
    # Emulator coverage supplements (and cannot replace) testing with a real SIM.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented Android smoke tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            adb shell am start -W -n org.greensvilla.qasidrelay/.MainActivity
            sleep 3
            adb shell pidof org.greensvilla.qasidrelay
            mkdir -p app/build/reports/androidTests/connected
            adb exec-out screencap -p > app/build/reports/androidTests/connected/operator-home.png
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qasidrelay-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
